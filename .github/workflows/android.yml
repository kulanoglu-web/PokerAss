name: Build PokerAss APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          cp "$APK" PokerAss.apk
      - name: Publish direct APK file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pokerass-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PokerAss.apk --title "PokerAss build ${GITHUB_RUN_NUMBER}" --notes "Installable Android debug APK for testing." --target "$GITHUB_SHA" --prerelease
