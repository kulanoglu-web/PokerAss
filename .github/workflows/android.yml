name: Build PokerAss APK
on:
  push:
    branches: [ main, video-reference-alignment ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Validate generated APK package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          test -n "$(unzip -Z1 "$APK" | grep '^AndroidManifest.xml
        run: cp app/build/outputs/apk/debug/app-debug.apk PokerAss.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PokerAss.apk --title "PokerAss Android build ${GITHUB_RUN_NUMBER}" --notes "Android debug APK built from commit ${GITHUB_SHA}. For testing; not a signed production release." --target "$GITHUB_SHA" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAss-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
)"
          test -n "$(unzip -Z1 "$APK" | grep '^classes.dex
        run: cp app/build/outputs/apk/debug/app-debug.apk PokerAss.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PokerAss.apk --title "PokerAss Android build ${GITHUB_RUN_NUMBER}" --notes "Android debug APK built from commit ${GITHUB_SHA}. For testing; not a signed production release." --target "$GITHUB_SHA" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAss-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
)"
          echo "APK archive and required entries verified"
      - name: Rename installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PokerAss.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PokerAss.apk --title "PokerAss Android build ${GITHUB_RUN_NUMBER}" --notes "Android debug APK built from commit ${GITHUB_SHA}. For testing; not a signed production release." --target "$GITHUB_SHA" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAss-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
